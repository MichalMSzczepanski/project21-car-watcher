<!doctype html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AutoWatch — obserwowane ogłoszenia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/app.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <span class="navbar-brand mb-0 h1">🚗 AutoWatch</span>
        <span class="text-white-50 flex-grow-1 ms-3">Twoje obserwowane ogłoszenia</span>
        <a href="changes.html" class="btn btn-outline-light btn-sm">Wszystkie zmiany &rarr;</a>
    </div>
</nav>

<div class="container">
    <div id="loading" class="text-center text-muted py-5">Wczytywanie...</div>
    <div id="empty-state" class="text-center text-muted py-5 d-none">
        <p class="fs-5">Nie obserwujesz jeszcze żadnego ogłoszenia.</p>
        <p>Dodaj je przez <code>POST /listings</code> (na razie bez GUI do dodawania — zob. dokumentację API).</p>
    </div>
    <div id="error-state" class="alert alert-danger d-none"></div>
    <div id="listings" class="row g-4"></div>
</div>

<template id="listing-card-template">
    <div class="col-12 col-md-6 col-lg-4">
        <a class="text-decoration-none text-reset listing-link" href="#">
            <div class="card card-listing h-100 shadow-sm">
                <div class="thumb-slot"></div>
                <div class="card-body">
                    <h5 class="card-title title-slot"></h5>
                    <p class="price-value text-primary price-slot mb-1"></p>
                    <p class="text-muted small mileage-slot mb-1"></p>
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="badge status-slot"></span>
                        <span class="text-muted small checked-slot"></span>
                    </div>
                    <div class="btn btn-danger btn-sm w-100 mt-2 change-cta d-none"></div>
                </div>
            </div>
        </a>
    </div>
</template>

<script src="js/format.js"></script>
<script src="js/api.js"></script>
<script src="js/cards.js"></script>
<script src="js/index.js"></script>
</body>
</html>
