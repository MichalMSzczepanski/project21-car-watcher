spring.application.name=project21-car-report

spring.datasource.url=jdbc:h2:file:./data/car-report;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.io.github.michalmszczepanski.carreport=DEBUG
logging.level.org.springframework.web=DEBUG

# Baza URL do budowy linków weryfikacyjnych w e-mailach (placeholder, do ustawienia
# na realny adres produkcyjny).
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Logowanie przez Google — rejestracja budowana programowo w SecurityConfig
# (ClientRegistrationRepository bean), NIE przez te property, bo Spring Boot waliduje
# spring.security.oauth2.client.registration.* przy starcie i wywala appkę, jeśli
# client-id jest puste (sprawdzone empirycznie). Zmienne GOOGLE_CLIENT_ID/GOOGLE_CLIENT_SECRET
# czytane są bezpośrednio w SecurityConfig przez @Value — bez nich rejestracja Google
# po prostu nie powstaje (reszta appki działa normalnie, logowanie Google jest wyłączone).
